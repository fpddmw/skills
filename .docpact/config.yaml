version: 1
layout: repo
lastReviewedAt: "2026-08-30"
lastReviewedCommit: "34ee21593ec90bf7c1c96445d3a97b453bcb2531"

repo:
  id: skills

routing:
  intents:
    governance:
      paths:
        - AGENTS.md
        - .docpact/**
        - .github/workflows/docpact.yml
        - .dockerignore
        - Dockerfile.clean-test
        - scripts/**
        - _docs/**
        - README.md
        - README.zh-CN.md
    skill:
      paths:
        - "*/SKILL.md"
        - "*/agents/**"
        - "*/scripts/**"
        - "*/references/**"
        - "*/assets/**"
    marketplace:
      paths:
        - .claude-plugin/**
    atomic-data-migration:
      paths:
        - _docs/architecture/atomic-data-capabilities.md
        - _docs/runbooks/atomic-data-skill-migration.md
        - "*-fetch/**"
        - "*-search/**"
        - "*-download/**"
        - "gdelt-*/**"
        - "open-meteo-*/**"
        - "regulationsgov-*/**"
        - tiangong-auto-research/**

coverage:
  include:
    - AGENTS.md
    - README.md
    - README.zh-CN.md
    - .docpact/**
    - .github/workflows/docpact.yml
    - .dockerignore
    - Dockerfile.clean-test
    - scripts/**
    - _docs/**
    - .claude-plugin/**
    - "*/SKILL.md"
    - "*/agents/**"
    - "*/scripts/**"
    - "*/references/**"
    - "*/assets/**"
    - "*/README.md"
    - "*/README.zh-CN.md"
    - "*/QUICKSTART_CN.md"
  exclude:
    - .git/**
    - .docpact/runs/**
    - node_modules/**
    - dist/**
    - build/**
    - coverage/**
    - .DS_Store
    - "**/.DS_Store"

docInventory:
  include:
    - AGENTS.md
    - README.md
    - README.zh-CN.md
    - .docpact/config.yaml
    - _docs/**
  exclude:
    - .git/**
    - .docpact/runs/**
    - node_modules/**
    - dist/**
    - build/**
    - coverage/**

freshness:
  warn_after_commits: 50
  warn_after_days: 90
  critical_after_days: 180

rules:
  - id: skills-governance
    scope: repo
    repo: skills
    triggers:
      - path: AGENTS.md
        kind: agent-contract
      - path: .docpact/config.yaml
        kind: machine-contract
      - path: .github/workflows/docpact.yml
        kind: governance-ci
      - path: .dockerignore
        kind: clean-container-context-policy
      - path: Dockerfile.clean-test
        kind: clean-container-image
      - path: scripts/**
        kind: repository-validation-script
      - path: _docs/**
        kind: governed-docs
      - path: README.md
        kind: repo-entry
      - path: README.zh-CN.md
        kind: localized-repo-entry
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: _docs/README.md
        mode: review_or_update
      - path: _docs/contracts/repo-contract.md
        mode: review_or_update
      - path: _docs/standards/documentation-standards.md
        mode: review_or_update
      - path: _docs/runbooks/development.md
        mode: review_or_update
    reason: Repository entry guidance, governance config, and documentation standards must remain aligned.
  - id: skills-skill-surface
    scope: repo
    repo: skills
    triggers:
      - path: "*/SKILL.md"
        kind: skill-entry
      - path: "*/agents/**"
        kind: generated-agent-config
      - path: "*/scripts/**"
        kind: skill-script
      - path: "*/references/**"
        kind: skill-reference
      - path: "*/assets/**"
        kind: skill-asset
      - path: "*/README.md"
        kind: skill-readme
      - path: "*/README.zh-CN.md"
        kind: localized-skill-readme
      - path: "*/QUICKSTART_CN.md"
        kind: skill-quickstart
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: README.zh-CN.md
        mode: review_or_update
      - path: _docs/architecture/repo-architecture.md
        mode: review_or_update
      - path: _docs/contracts/repo-contract.md
        mode: review_or_update
      - path: _docs/runbooks/development.md
        mode: review_or_update
    reason: Skill definitions, generated agent configs, scripts, references, assets, and per-skill docs must follow the repository skill workflow.
  - id: skills-marketplace
    scope: repo
    repo: skills
    triggers:
      - path: .claude-plugin/**
        kind: marketplace-metadata
    requiredDocs:
      - path: README.md
        mode: review_or_update
      - path: README.zh-CN.md
        mode: review_or_update
      - path: _docs/architecture/repo-architecture.md
        mode: review_or_update
      - path: _docs/runbooks/development.md
        mode: review_or_update
      - path: _docs/contracts/repo-contract.md
        mode: review_or_update
    reason: Marketplace metadata affects skill discovery and installation and must stay aligned with repository docs.
  - id: skills-atomic-data-migration
    scope: repo
    repo: skills
    triggers:
      - path: _docs/architecture/atomic-data-capabilities.md
        kind: atomic-data-architecture
      - path: _docs/runbooks/atomic-data-skill-migration.md
        kind: atomic-data-runbook
      - path: "*-fetch/**"
        kind: data-fetch-skill
      - path: "*-search/**"
        kind: data-search-skill
      - path: "*-download/**"
        kind: data-download-skill
      - path: "gdelt-*/**"
        kind: gdelt-data-skill
      - path: "open-meteo-*/**"
        kind: open-meteo-data-skill
      - path: "regulationsgov-*/**"
        kind: regulations-data-skill
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: _docs/architecture/repo-architecture.md
        mode: review_or_update
      - path: _docs/contracts/repo-contract.md
        mode: review_or_update
      - path: _docs/architecture/atomic-data-capabilities.md
        mode: review_or_update
      - path: _docs/runbooks/atomic-data-skill-migration.md
        mode: review_or_update
      - path: _docs/runbooks/development.md
        mode: review_or_update
    reason: Data Skills must remain thin semantic consumers of the CLI-owned TypeScript runtime and machine contract.
